# ----------------------------------------------------------------------
# Edge function JWT verification.
#
# By default the Supabase API gateway requires a valid Supabase JWT on
# every function call (verify_jwt = true). That's correct for functions
# the browser calls on behalf of a logged-in user, but WRONG for the
# Razorpay webhook: Razorpay calls it server-to-server with only an
# X-Razorpay-Signature header and no Supabase JWT, so the gateway would
# reject every webhook with 401 before our code runs.
#
# NOTE: a per-function config.json is NOT read by Supabase — JWT
# verification can only be configured here (or via --no-verify-jwt).
# ----------------------------------------------------------------------

[functions.razorpay-create-order]
verify_jwt = true

[functions.razorpay-verify-payment]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false

# --- Cashfree (active provider) ---
[functions.cashfree-create-order]
verify_jwt = true

[functions.cashfree-verify-payment]
verify_jwt = true

# Public: Cashfree calls this server-to-server with x-webhook-signature,
# no Supabase JWT. Must stay false or the gateway rejects every webhook.
[functions.cashfree-webhook]
verify_jwt = false
